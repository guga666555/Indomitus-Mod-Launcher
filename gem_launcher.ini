[launcher]
; Compiled INTO the launcher at build time (build_zig.bat copies it to launcher\settings.gen.ini with
; version= filled in from git); nothing ships next to the exe. Change a value, rebuild.
; DEV builds (build_zig.bat dev) also read a gem_launcher.ini placed next to the exe.

; Shown in the launcher window (next to the title), in its caption, in the exe's properties and in update.ini.
; The version comes from the newest git tag named like v1.2.3: tag a commit in GitHub Desktop, then build.
; version= below is only used while the repository has no such tag.
version=0.9.4
build_label=BUILD
subtitle=GEM engine extension launcher

; Full path to call_to_arms.exe. Leave empty to auto-detect through Steam
; (libraryfolders.vdf + appmanifest_400750.acf).
exe=

; The engine extension is built into the launcher (launcher\payload at build time) and cannot be
; changed here. Its logs are written to %LocalAppData%\Indomitus Launcher\payload\<code>\.
; DEV builds only: extra DLLs are also loaded from this folder.
dll_dir=dlls

; Mods to switch on in the game profile before every launch: folder names under <game>\mods,
; comma-separated, in order. They are added to Documents\my games\gates of hell\profiles\<id>\options.set
; (a one-time options.set.launcher-backup is kept). Empty = leave the mod list alone.
require_mods=
; 1 = enable ONLY the mods above and switch every other mod off; 0 = add them, keep the rest.
mods_exclusive=0
; Profile folder id to edit. Empty = the most recently used profile.
mods_profile=

; 1 = show the "Open the mods folder" button (handy for developers), 0 = hide it for end users.
show_mod_folder_button=1
; 1 = show the "Disable Indomitus mods" button: removes require_mods from the game profile so a
; normal Steam start runs vanilla (the launcher re-enables them on its next launch).
show_disable_mods_button=1

; Editor exe. Leave empty to use call_to_arms_ed.exe next to the game exe.
editor_exe=

; Button sounds: embedded = the sounds built into the exe, none = silent, or a path to a .wav file.
sound_hover=embedded
sound_click=embedded

; Title font. Empty = the TTF embedded at build time (launcher\res\title.ttf), or Impact if none.
; Any font installed on Windows works too, by face name. title_size is in points.
title_font=
title_size=52

; Extra command line passed to the game (optional, not used for the editor).
args=

; 1 = Play / Editor first make sure the Steam client is running and logged in (default).
require_steam=1
; 1 = start Steam automatically if it isn't running and wait for it; 0 = just show a message.
steam_autostart=1
; How long to wait for Steam to start and log in (ms) before giving up.
steam_timeout_ms=120000

; ---- auto-update (release builds; DEV builds never update)
; update_url     = where launchers look for the newest update.ini. Empty = auto-update off.
; update_exe_url = where the new Indomitus.exe can be downloaded; build_zig.bat writes it into the signed update.ini.
; update_min_version = optional. Launchers older than this cannot start the game until they update (keeps every
;                  multiplayer peer on the same extension). Leave empty for an optional update.
; Release steps: raise version=, run build_zig.bat, upload dist\release\Indomitus.exe and dist\release\update.ini.
; GitHub example (both files attached to the newest release):
;   update_url=https://github.com/OWNER/REPO/releases/latest/download/update.ini
;   update_exe_url=https://github.com/OWNER/REPO/releases/latest/download/Indomitus.exe
update_url=https://github.com/guga666555/Indomitus-Mod-Launcher/releases/latest/download/update.ini
update_exe_url=https://github.com/guga666555/Indomitus-Mod-Launcher/releases/latest/download/Indomitus.exe
update_min_version=

; Steam app id of Call to Arms - Gates of Hell.
appid=400750

; 1 = keep the launcher alive until the game exits and log its exit code.
wait_for_exit=1

; 1 = also open a live console window with the log (the exe is windowless by default).
console=0
