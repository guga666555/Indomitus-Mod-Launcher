; GEM Teleport settings. Lives next to gem_teleport.dll (the Indomitus launcher payload folder).
; Read by call_to_arms.exe, call_to_arms_ed.exe and call_to_arms_server.exe only.
; Every feature checks the engine code at startup; anything it does not recognise stays off and
; gem_teleport.log says so. The teleport changes game state: every player of a multiplayer match
; needs this DLL.
[teleport]

; ==== general ====
; 0 = nothing is patched
enabled=1
; gem_teleport.log next to the DLL
log=1
; console window with the same messages
console=0
; log every parsed {teleport}, every jump (first 50), refused orders and ignored damage (first 50 each)
verbose=1
; log fatal exceptions (with a stack scan)
crash_log=1
; also log C++ throws (the engine throws and catches a few at load - every GEM DLL would log the same ones)
log_cpp_exceptions=0

; ==== {teleport} instruction ====
; values used when an action file leaves a parameter out
; radius in metres around the soldier in which a ground click is accepted
default_max_radius=30
; seconds between the click (lock, "teleport_begin") and the move ("teleport_jump")
default_pre_use_delay=0.5
; seconds between the move and the release ("teleport_end")
default_post_use_delay=0.5

; fire the interaction events {on "teleport_begin"} / {on "teleport_jump"} / {on "teleport_end"} on the soldier
events=1
; while teleporting (click .. release): new orders to the soldier are refused (Entity::GiveOrder)
lock_orders=1
; while teleporting: health_damage_* actions do nothing to the soldier (independent of lock_orders)
invulnerable=1
; multiplayer: everything in this section changes the simulation - all players must have the same values
; (the sealed launcher payload guarantees that)
