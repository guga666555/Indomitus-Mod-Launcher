; GEM BoardFilter 0.4 - who may crew/board a vehicle, by entity tags (Alex's 0.1 rule).
;   vehicle tag board_<class> (any number): humans of one of those classes may board it
;   vehicle without a board_ tag: classes in DefaultBoard (empty = anyone)
;   vehicle tag no_board: nobody may board it
;   human tag boarder_<class> (any number): its classes (breed {tags} via GEM BreedTags, script {tags add})
;   human without a boarder_ tag: classes in DefaultClass
;   Runtime tags only, read on every check; exact, case-sensitive. The mod turns vehicle def props into these tags on spawn.
; Shipped sealed inside the Indomitus Launcher payload: every machine in a multiplayer game runs the same dll + ini
; (boarding is simulated in lockstep). Edit this file in the dll repo, then build.bat payload and rebuild the launcher.
[BoardFilter]
; 0 = nothing is patched, vanilla boarding
Enabled=1
; vehicle tag prefix: board_<class>
VehiclePrefix=board_
; human tag prefix: boarder_<class>
UnitPrefix=boarder_
; vehicle tag that closes it to everyone (empty = none)
NoBoardTag=no_board
; classes a vehicle without a board_ tag accepts (comma list; empty = anyone)
DefaultBoard=mortal
; class(es) of a human without a boarder_ tag (comma list)
DefaultClass=mortal
; 1 = a human already sitting in a vehicle it may not board is emitted by the engine (wrong crew)
EjectOccupants=1
; script event fired on the vehicle when a board ORDER is refused (empty = none); the mod's "vehicle" block shows a popup
PopupEvent=board_refused
; the same unit+vehicle pair fires the event at most once per this many ms (engine sim clock, 0..600000)
PopupCooldownMs=3000
; 1 = log refusals (first 400) to gem_boardfilter.log; repeated refusals of one unit+vehicle pair log as "order retry"
Log=1
