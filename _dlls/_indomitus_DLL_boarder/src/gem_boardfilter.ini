; GEM BoardFilter 0.3 - restrict who may crew/board a vehicle with def props.
;   vehicle .def {props "crew_only_<tag>"} (any number): only humans with one of those <tag>s may board it
;   vehicle without a crew_only_ prop: anyone (vanilla)
;   human tags = its engine tags (breed {tags} via GEM BreedTags, script {tags add}) and its def {props}; exact match
; Shipped sealed inside the Indomitus Launcher payload: every machine in a multiplayer game runs the same dll + ini
; (boarding is simulated in lockstep). Edit this file in the dll repo, then build.bat payload and rebuild the launcher.
[BoardFilter]
; 0 = nothing is patched, vanilla boarding
Enabled=1
; vehicle def prop prefix; the rest of the prop is the tag a human needs (exact, case-sensitive)
PropPrefix=crew_only_
; 1 = a human already sitting in a vehicle it may not board is emitted by the engine (wrong crew)
EjectOccupants=1
; script event fired on the vehicle when a board ORDER is refused (empty = none); the mod's "vehicle" block shows a popup
PopupEvent=board_refused
; the same unit+vehicle pair fires the event at most once per this many ms (engine sim clock, 0..600000)
PopupCooldownMs=3000
; 1 = log refusals (first 400) to gem_boardfilter.log; repeated refusals of one unit+vehicle pair log as "order retry"
Log=1
