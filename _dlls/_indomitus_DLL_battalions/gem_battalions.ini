; GEM Battalions 0.1.0 - probe (logs only, changes nothing in the game)
; Lives next to gem_battalions.dll in the launcher payload. Log: gem_battalions.log next to it.

[gem_battalions]
log=1
verbose=1
; 1 = do nothing in call_to_arms_ed.exe / call_to_arms_server.exe (no campaign there)
game_only=1
; stop writing the log after this many MB
max_log_mb=32

[trace]
; wrap every virtual slot of the matching classes with a logging trampoline
enabled=1
; class name patterns, ';' separated, '*' allowed at either end (names as in the log's class list)
classes=*Campaign*;*Conquest*
; classes that are already mapped (ConquestUI) or too noisy
exclude=*Portrait*;*Icon*;*Line*;*Panel*;*ResearchTree*;*Library*;*Button*
; per slot: log the first N calls, then every M-th call (0 = only the first N)
first=10
every=500
max_slots=4096
; wait before hooking so this DLL wraps the slots after the other payload DLLs (ms)
install_delay_ms=5000

[dump]
; bytes of eGUI_DynamicCampaignView dumped on Bind (the known fields reach +0x9E0)
view_bytes=0xA40
; follow pointers to objects of these classes (0x400 bytes each) and track them for diffs
classes=*Campaign*;*Conquest*;*Research*;*Region*;*Army*
depth=2
; minimum ms between diffs triggered by view Update
diff_min_ms=100

[files]
; log CreateFileW calls on profile / campaign / save paths with the caller
enabled=1
