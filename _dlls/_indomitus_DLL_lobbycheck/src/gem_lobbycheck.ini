; GEM LobbyCheck 0.1 - warns when the players in a multiplayer lobby run different launcher builds
; Shipped inside the Indomitus Launcher payload: edit THIS file in the repo and rebuild the
; launcher. The copy under %LocalAppData%\Indomitus Launcher\payload\ is rewritten every launch.
; Nothing here changes the simulation. Texts of the message box are in the dll (English).
[LobbyCheck]
; 0 = the dll hooks nothing at all
Enabled=1
; 1 = the host also gets a message for every player whose build differs or who reports none
; 0 = only the players that join are told (the host still publishes its build)
HostNotice=1
; how long a host / a player may take to report its build before it counts as "reports none"
; (an older launcher without this check, or a game started without the launcher). 2..120
GraceSeconds=10
; 0 = findings go to the log only, no message box
ShowMessage=1
; gem_lobbycheck.log (game) / gem_lobbycheck_server.log (MP host server), rewritten every run
Log=1
