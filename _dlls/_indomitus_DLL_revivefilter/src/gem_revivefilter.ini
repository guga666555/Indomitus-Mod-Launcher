[ReviveFilter]
; 1 = soldiers tagged (or def prop) <PatientPrefix><class> can only be revived by units tagged <UnitPrefix><class>
Enabled=1
; patient side: runtime tag (breed {tags} through GEM BreedTags, or script {tags add}) or def prop, e.g. revive_by_apothecary
PatientPrefix=revive_by_
; reviver side: runtime tag. Empty = the class itself: revive_by_apothecary -> unit tag "apothecary"
UnitPrefix=
; 1 = also refuse the player's revive command for a refused unit (it keeps its current order); 0 = only the order fails
Command=1
; script event fired on the patient when a player's revive command is refused (empty = none); the human block in
; 40k_human.inc shows the popup
PopupEvent=revive_refused
; at most one popup per unit + patient pair in this time (ms)
PopupCooldownMs=3000
; 1 = also patch call_to_arms_server.exe (the revive order runs in the simulation: every MP machine needs the same rule)
Server=1
; 1 = log the first 300 refusals to gem_revivefilter.log (editor: gem_revivefilter_editor.log)
Log=0
