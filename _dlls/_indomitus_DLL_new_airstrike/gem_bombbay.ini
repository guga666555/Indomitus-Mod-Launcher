; GEM BombBay 0.7 settings. Ships next to gem_bombbay.dll in the Indomitus Launcher payload (launcher\payload\),
; so it is sealed into the launcher build: players cannot edit it. Log: gem_bombbay.log next to the dll
; (%LocalAppData%\Indomitus Launcher\payload\<fingerprint>\).
[bombbay]
; 0 = load nothing
Enabled=1
; gem_bombbay.log next to the dll; Verbose = also log the first BombLog bomb-bay lines
LogFile=1
Verbose=1
Console=0

; bomb bay airstrikes: {action "airstrike:<BombAction>[_<N>ms][_<N>m]"} planes drop their own bombs from the bay instead of
; the engine spawning one; every other airstrike name stays vanilla (BombAction empty = every airstrike). _<N>ms = ms between
; the bombs of that roster line (else the bomb weapon's set tag bomb_interval_<ms>, else BombInterval); _<N>m = that line's
; flight altitude in metres (else BombAltitude; vanilla airstrikes fly at 40 m, which other airstrike names keep).
; BombPlace = weapon place name prefix ("bomb" -> bomb1, bomb2); BombEvent = script event sent to the plane at the start of
; the run (bomb doors), plus <BombEvent>_dropN when bomb N leaves the bay; BombVelocity = % of the plane's own speed the
; bombs carry when released (the engine reads 0 for planes; 0 = drop straight down); BombLead 1 = start the stick early so
; it lands centred on the click (forward carry while falling + half the stagger); BombLeadDelay = release that many ms
; later than the computed lead (positive = closer to the click); BombBayMultiplayer 0 = vanilla behaviour in network games
; (orders only exist on the host; whether eBombShooter bombs replicate to clients is untested); BombLog = first N log lines
BombAction=marauder_bomb
BombPlace=bomb
BombEvent=bomb_run
BombInterval=200
BombVelocity=100
BombLead=1
BombLeadDelay=1000
BombAltitude=40
BombBayMultiplayer=0
BombLog=16
