[TeamTags]
; 1 = keep the tag <Prefix><player> on every actor (human, vehicle, gun) that has an owning player
Enabled=1
; tag prefix: team -> team0, team1, ... (lowercase, max 12 characters)
Prefix=team
; 1 = re-apply after a unit is loaded from a map or save (the load sets the player before the saved tags)
ReapplyOnLoad=1
; 1 = log every tag change to gem_teamtags.log
Log=0
