[UnitName]
; 1 = a non-human unit whose def has a prop <Prefix><list> shows a name from names/<list>/first + names/<list>/last
Enabled=1
; start of the def prop that names the list (lowercase)
Prefix=name_
; text shown in the unit panel's name line; {first} and {last} are replaced ({first} may be missing: its space goes too)
Format=<c(c3baae)>{first} {last}</c>
; 1 = log the first 50 names given and any missing localization list to gem_unitname.log (editor: gem_unitname_editor.log)
Log=0
