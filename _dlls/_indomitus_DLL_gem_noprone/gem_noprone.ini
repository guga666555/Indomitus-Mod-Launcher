; GEM NoProne settings. Sealed into the Indomitus Launcher with the DLL: build.bat payload copies
; this file into launcher\payload\; the launcher extracts it next to the DLL at
; %LocalAppData%\Indomitus Launcher\payload\<code>\. Change a value, rebuild the launcher.
[noprone]
; 0 = load nothing
Enabled=1
; Breed {tags} / entity tag that stops the AI going prone (case-insensitive)
Tag=cannot_lie
; gem_noprone.log next to the dll; Verbose logs the first block per breed
LogFile=1
Verbose=1
Console=0
