; GEM PreviewScene 0.2.0 (test build)
; Log: gem_previewscene.log (game) / gem_previewscene_editor.log (editor), next to this file.
[previewscene]
enabled=1
log=1
console=0

; --- test features (empty = off = vanilla preview) ---
; Map (and mission) the unit preview's scene loads instead of nothing, written like the game writes it:
;   <map path under /map/>            e.g.  single/preview_test
;   <map path>:<mission>              e.g.  single/preview_test:preview
; The log line "PREVIEW MAP -> descriptor" shows how the engine understood it. Empty it again to undo.
preview_map=
; Mission event set each time the unit shown in a preview changes. The mission must declare it
; (Helpers -> event) and reset it in the trigger that reacts to it.
unit_changed_event=

; --- logging ---
; every scene load: scene name + map descriptor (game and editor)
log_scene_loads=1
; the preview's entities and the unit template it shows (game only)
log_preview_units=1
; mission commands that run: event, trigger, spawn, squad_create, reinforcement, waypoint, squad_to_waypoint,
; actor_to_waypoint, board, delete, entity_state, air_state, scenario (game and editor)
log_mission_commands=1
; how often (ms) the previews are checked; a line is written only when something changed
preview_check_ms=1000
; at most this many preview dumps per run
max_dumps=60
; each mission command type is logged this many times, then every 100th
mission_log_max=40
