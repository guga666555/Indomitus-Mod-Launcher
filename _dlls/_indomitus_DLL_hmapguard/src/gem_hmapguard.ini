; GEM HeightmapGuard 0.1 - skips a stale heightmap patch record instead of crashing (crater on a stale cell)
[HeightmapGuard]
; 0 = handler not installed
Enabled=1
; 0 = leave the dedicated server alone
Server=1
; 1 = one "skip:" line per skipped record in gem_hmapguard[_server|_editor].log
Log=1
MaxLogLines=200
