; GEM SquadFollow 0.2 - looser squad follow (fewer follower re-orders = no run anim resets)
; Shipped inside the Indomitus Launcher payload: edit THIS file in the repo and rebuild the
; launcher. The copy under %LocalAppData%\Indomitus Launcher\payload\ is rewritten every launch.
; Multiplayer: these numbers change the simulation, so every player must run the same values.
; Units are GEM world units (20 per metre, the same as unit positions). Vanilla values in brackets.
[SquadFollow]
; 0 = vanilla behaviour (the dll still counts re-orders when Log=1)
Enabled=1
; a follower gets a new move order only when its formation slot has moved this far
; from where it was when the last order went out [6.32]
MinDrift=12
; ...and drift^2 > DriftRatio x (slot-to-leader distance)^2 [0.5]
DriftRatio=0.5
; ...and at least this much game time has passed since its last order, 0..60000 [0]
MinIntervalMs=600
; past this drift the interval is ignored and the follower is re-ordered at once
; (sharp leader turns); 0 = never [none]
ForceDrift=40
; 0 = off, 1 = 10 s stats (vanilla vs new re-order counts), 2 = stats + every re-order
; (the install lines are always written)
Log=0
