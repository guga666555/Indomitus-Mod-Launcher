[CrewVoice]
; 1 = a vehicle with no crew speaks with the language named by its def prop "<Prefix><name>"
Enabled=1
; start of the def prop that names the language (lowercase). The whole prop is the language word in talk.set.
Prefix=voice_
; 1 = also patch call_to_arms_server.exe, so every machine in an MP game runs the same code
Server=1
; 1 = log the first 300 lines spoken this way to gem_crewvoice.log (editor: gem_crewvoice_editor.log)
Log=1
