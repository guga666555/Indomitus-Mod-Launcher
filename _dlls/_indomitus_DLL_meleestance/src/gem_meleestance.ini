[MeleeStance]
; 1 = hook installed
Enabled=1
; script tag that puts a human in melee stance (the melee_toggle button adds/removes it)
Tag=melee_stance
; second tag that also means "in stance", for breed {tags} / mission triggers; the button never removes it
AlwaysTag=melee_always
; ammo {tag}s that count as melee; every other ammo is refused while the unit is in stance
MeleeAmmoTags=melee_vs_human,melee_vs_all,medium_inf_melee_target,medium_veh_melee_target,heavy_veh_melee_target
; 1 = units linked to something (vehicle crew, gunners, passengers) ignore the stance and the charge
SkipLinked=1
; 1 = ammo.set melee rows marked {ready_for_shot} also let a unit in stance draw the weapon from its belt
DrawFromBelt=1
; 1 = turning the stance ON (melee_toggle) puts the melee weapon in hand ({take_item} in melee_toggle.set), and a charge by a stance unit
; that is not holding its melee weapon re-draws it before the attack order
DrawOnToggle=1
DrawButton=melee_toggle
; ms: no second take-item order for the same unit while the first may still be running (a re-added order restarts the take)
DrawCooldownMs=3000
; 1 = write gem_meleestance.log (install lines + the first 40 stance and 40 charge decisions)
Log=1

[Charge]
; 1 = units with melee weapons charge enemies they see (same attack order as a double-click)
Enabled=1
; script tag a unit needs to charge (units in melee stance always qualify)
Tag=has_melee_weapon
; 1 = only while the melee weapon is in hand (stance units always qualify)
MeleeInHand=1
; 1 = player-controlled units charge too, 0 = AI units only
PlayerUnits=1
; minimum time between two charge orders at the same enemy, per unit (ms)
CooldownMs=4000
; minimum time between any two charge orders, per unit (ms)
RetargetMs=1500
; one attack order per enemy: while the unit is still closing on the enemy it was sent at, nothing is re-issued (a new order
; restarts the running one: the unit stops and re-paths). Re-issued only when the unit stalls (closed less than ProgressUnits
; since the last check, after CooldownMs), the enemy is gone, or another enemy is closer than SwitchRatio x the current one
SwitchRatio=0.6
ProgressUnits=10
; the charge itself: farther than CloseDistance (world units, 20 = 1 m) the unit gets the player's double-click move: a movement-mode
; order (RunMode: the engine's 0..3 modes, 2 = run; -1 = none) and then Order::eMoveTask to the enemy's spot (the double-click move;
; the single-click move is Order::eAdvance, the slow weapon-up walk, which forces mode 1), re-issued when the enemy moved MoveRefreshUnits
; from it; inside CloseDistance the attack_melee order (Order::eFight, what the attack_melee button gives); inside MinDistance nothing.
; An attack order on an enemy out of weapon reach does not make a stance unit approach.
; (0 = eFight from the start with no run phase: tried Nov 7 2026, worse than the run phase)
CloseDistance=200
MoveRefreshUnits=80
RunMode=2
; farthest enemy to charge, in world units (20 = 1 m; 2000 = 100 m; 0 = any enemy the unit's scan sees)
MaxDistance=2000
; closer than this (world units) the unit is already fighting: no new order (stops order spam in melee)
MinDistance=60

[MultiSelect]
; 1 = {instant} buttons with {apply_to_all} (melee_toggle, overcharge, jetpack...) work on several selected units;
; vanilla only runs them when exactly one selected unit can use them
Enabled=1

[ShieldMelee]
; 1 = engine paired melee can start on a unit wearing a forcefield: the blow's attacker->target ray ignores
; hits on entities linked to the target (its shield, its kit) or carrying SeeThroughTag; walls/others still block
; 0 since 0.6.1 (Alex: back to 0.6 behaviour, no engine patch)
Enabled=0
SeeThroughTag=forcefield

[Downed]
; 1 = no weapon is chosen against a unit carrying Tag (bled-out / personage state), so the AI ignores downed units
; and melee units don't charge them
Enabled=1
Tag=start_personage

[BlowReach]
; engine paired melee (vanilla set\blow: fists, kick, rifle butt, knife, bayonet, sword): the attacker walks to
; within this distance of the target's centre, then the blow plays. World units; vanilla 17 / 29 / 35.
; Applies to every paired fight in the game (no per-target version). Enabled=0 = keep vanilla.
Enabled=1
Near=45
Medium=45
Far=45
