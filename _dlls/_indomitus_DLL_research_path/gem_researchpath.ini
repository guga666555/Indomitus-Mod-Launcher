; GEM ResearchPath settings. Lives next to the DLL (the launcher payload folder when injected by the
; Indomitus Launcher). Only call_to_arms.exe has the Dynamic Campaign research tree; in the editor and the
; dedicated server the DLL logs one line and does nothing. UI only: nothing here touches the simulation.
[researchpath]
; 0 = nothing is patched
enabled=1
; gem_researchpath.log next to the DLL (editor / server: gem_researchpath_editor.log / _server.log)
log=1
; console window with the same messages
console=0
; log the first few hovers / tooltips (capped)
verbose=1

; ---- path highlight ----
; Hovering a unit in the research tree highlights it and every prerequisite you still have to research
; (researched units end the walk).
highlight=1
; which frame of the icon's own button a highlighted icon is drawn with:
; 1 = the hover frame, 2 = the pressed frame, 3 = the disabled frame (0 = normal, i.e. no visible change)
highlight_frame=1
; glow over the icons on the path: a hidden widget the mod adds to UnitPortraitView.xml
; (mod_side\UnitPortraitView.xml: id "rp_glow", texture /interface/scene/portrait_squad/frame_glow,
;  i.e. resource\interface\scene\portrait_squad\frame_glow.tga - draw it however you like).
; The DLL only shows / hides it. Without the widget in the layout there is no glow (logged).
glow=1
glow_widget=rp_glow

; ---- path lines (needs highlight=1) ----
; The research lines along the highlighted path are redrawn with another texture and color.
lines=1
; texture for path lines: a file next to the vanilla line in the mod,
;   resource\interface\pages\main\dynamic_campaign\<name>.tga   (vanilla: progress_line.tga, 1x10, white at 25% alpha)
; mod_side\progress_line_selected.tga = the same line fully opaque. Name only: no folder, no extension.
; Empty = keep the vanilla texture. If the file is not found in any mod the vanilla texture is kept (logged).
line_texture=progress_line_selected
; 0 = do not look for the file (e.g. it is inside a .pak)
line_texture_check=1
; color AARRGGBB (or RRGGBB = opaque), multiplied with the texture: FFFFFFFF = the texture as drawn
line_color=FFFFFFFF
; 1 = also redraw the links from the path to the researched units it starts from
line_to_researched=1

; ---- "requires" tooltip ----
; The tooltip of a locked unit ("Research previous unit to unlock") gets the missing units appended,
; deepest prerequisite first (the order to research them in).
tooltip=1
; text before the list; \n = new line, \s = a space (keeps a space at the start/end of the value)
tooltip_prefix=\nRequires:\s
tooltip_separator=,\s
; at most this many names, then tooltip_more (must contain exactly one %d = the number left out)
tooltip_max_names=4
tooltip_more=,\s+%d more
