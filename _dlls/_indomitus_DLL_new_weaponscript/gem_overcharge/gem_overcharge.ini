; GEM Overcharge settings. Lives next to gem_overcharge.dll.
[overcharge]
; 0 = load nothing
Enabled=1
; while the firing unit (or the vehicle its gunner sits in) carries this script tag, its weapon fires the ammo whose
; set-file name tags are the loaded ammo's plus OverchargeSuffix (plasmagun_mag.ammo -> plasmagun_mag.overcharge.ammo).
; An overcharge shot costs one magazine round, like a standard shot.
OverchargeTag=overcharge
OverchargeSuffix=overcharge
; first N overcharge shots logged
OverchargeLog=10
; gem_overcharge.log next to the dll; Verbose = log lines above; Console opens a log window
LogFile=1
Verbose=1
Console=0
