; GEM Converge settings. Lives next to gem_converge.dll.
[converge]
; 0 = load nothing
Enabled=1
; stuff tag on the gun's set file that turns convergence on for that weapon (case-insensitive)
Tag=converge
; no correction when the aim point is closer than this (world units, 20 = 1 m)
MinDistance=3
; 1 = also act in network games. Unsynced weapons are simulated on every machine, so every player needs the dll
; (the correction is deterministic, so lockstep copies agree); 0 = do nothing in network games
AllowMultiplayer=1
; bullets_per_shot_<N> weapons: cone half-angle in degrees unless the weapon carries bullet_spread_<deg>; max N accepted
BulletSpread=3
BulletsPerShotMax=32
; gem_converge.log next to the dll; Verbose logs the first LogShots affected shots; Console opens a log window
LogFile=1
Verbose=1
LogShots=10
Console=0
