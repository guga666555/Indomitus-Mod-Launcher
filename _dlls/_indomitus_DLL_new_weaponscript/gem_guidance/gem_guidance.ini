; GEM Guidance settings. Sealed into the Indomitus Launcher with the DLL: build.bat payload copies this file
; into launcher\payload\; the launcher extracts it next to the DLL at %LocalAppData%\Indomitus Launcher\payload\<code>\.
; Change a value, run build.bat payload, then build_zig.bat in the launcher folder.
[guidance]
; 0 = load nothing
Enabled=1
; weapon stuff tag that turns lock-on on (its ammo must also carry the vanilla "atgm" tag)
LockTag=lock_on
; fallback turn rate in deg/s, used only when the engine's own guidance cannot run (owner dead / weapon dropped)
LockTurn=10
; first N locks logged (lock / lock tick / lock end lines)
LockLog=10
; drift_<N> weapons: N = degrees the round is off at 100 units (grows with distance); max N accepted
DriftMax=45
; 1 = lock-on also in network games (every player needs the dll); 0 = vanilla guidance in network games.
; Drift always applies.
AllowMultiplayer=1
; gem_guidance.log next to the dll (payload folder); Verbose = log the first locks; Console opens a log window
LogFile=1
Verbose=1
Console=0
