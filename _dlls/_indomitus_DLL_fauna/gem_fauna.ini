; GEM Fauna settings. Lives next to gem_fauna.dll (the Indomitus launcher payload folder).
; Read by call_to_arms.exe, call_to_arms_ed.exe and call_to_arms_server.exe only.
; Every feature checks the engine code at startup; anything it does not recognise stays off and
; gem_fauna.log says so. "Simulation" features change game state: every player of a multiplayer
; match needs this DLL.
[fauna]

; ==== general ====
; 0 = nothing is patched
enabled=1
; gem_fauna.log next to the DLL
log=1
; console window with the same messages
console=0
verbose=1
; log fatal exceptions (with a stack scan) and who ends the process
crash_log=1

; ==== fauna ====
; fauna = vehicle-class units whose def carries this prop in its {props "..."} list
fauna_prop=fauna_main

; ==== UI (game and editor) ====
; health row in the VEHICLE selection panel and fauna in the squad member strip.
; The bar must exist in the mod's vehicle panel layout (copy bar_health from the human panel).
; Widget names: at most 15 characters.
fauna_ui=1
hp_bar_name=bar_health
hp_text_name=txt_health
; optional container of the bar: shown for fauna, hidden for other vehicles
hp_panel_name=pnl_health
; squad strip icon: a def prop named after a file in interface/scene/squad/ wins, else this file
; (name without extension, empty = none)
fauna_default_icon=soldier
; stamina row in the vehicle panel for fauna whose vitality has a {Stamina} block (copy bar_stamina from the human panel)
fauna_stamina_bar=1
stamina_bar_name=bar_stamina
stamina_text_name=txt_stamina
stamina_panel_name=pnl_stamina
; vehicle-panel widgets hidden while a fauna is selected (shown again for vehicles); up to 4 names, space separated,
; empty = hide nothing. e.g. "pnl_speed pnl_fuel"
fauna_hide_in_vehicle_panel=pnl_speed
; direct-control HUD: health and stamina rows instead of fuel and speed for fauna (row 2 hidden without a Stamina block)
fauna_dc_hud=1
dc_health_icon=/interface/scene/human_view/health
dc_stamina_icon=/interface/scene/human_view/stamina
; icons given back when a normal vehicle is controlled again (the engine's own)
dc_vehicle_icon_1=/interface/scene/vehicle_view/fuel
dc_vehicle_icon_2=/interface/scene/vehicle_view/speed
; over-head marker (the shield over the head) from a def prop: {props "icon_<name>"} replaces icon_vehicle(faction):
; {props "icon_carnifex"} -> interface/scene/squad/icon_carnifex_00/_01/_02.tga (normal/selected/highlighted)
fauna_head_icon=1
; direct control (simulation): a foot-chassis fauna walks into soldiers (ram / run over) instead of stopping at their
; edge like a soldier; with fauna_dc_crush_objects also into objects (fences, crates...: crush). Vehicles, other fauna,
; buildings and terrain still block it. Every MP peer needs the same setting.
fauna_dc_contact=1
fauna_dc_crush_objects=1

; ==== squads (simulation) ====
; a leader is elected (the engine gives squads of 2+ vehicle-class units none)
fauna_squad_elect=1
; members take the leader's walk/run mode (double-click run); needs fauna_squad_elect
fauna_squad_pace=1
; members walk to their formation slot like infantry (the engine lets vehicle-class followers idle until the
; leader is 15 m away). Radius in cm around the slot that counts as "there" (engine: 1500); needs fauna_squad_elect
fauna_squad_formation=1
fauna_formation_radius_cm=150
; box-selecting a whole squad, or loose fauna (the game makes them a squad), selects only its leader:
; leader portrait, the squad in the strip, direct control of the leader, orders through the squad
; (game and editor; needs fauna_ui, and fauna_squad_elect for loose units)
fauna_squad_select=1
; double-click run makes a fauna sprint (its chassis "Fast" entry) - also out of a squad and in walk mode (simulation)
fauna_double_click_sprint=1
; the sprint request sticks on a fauna's foot chassis (the vehicle brain otherwise puts it back to normal speed):
; double-click run, and Shift in direct control. A vitality {Stamina} block limits it like for soldiers.
fauna_sprint=1
; diagnostics: log the first fauna chassis speed calls (who asked, direct control, keys, result, commits)
fauna_sprint_debug=0

; ==== vitality (simulation; every multiplayer peer needs this DLL) ====
; {extender "vitality"} on a non-foot chassis (wheel, track, human_carrier) crashes the game in its first tick:
; the engine casts the chassis to the foot chassis for the stamina limit. 1 = the cast fails softly instead.
vitality_any_chassis=1

; ==== bandages (simulation; in multiplayer the host uses the bandage and tells the other players - all need this DLL) ====
; double-clicking a bandage in a fauna unit's inventory uses one and heals this percentage of its max health
; (1..100; nothing is used at full health). The item must carry the engine's "bandage" class tag, like the soldier bandage.
fauna_bandage=1
fauna_bandage_heal_percent=15

; diagnostics: log the selection's squad makeup, the first runs of each UI hook and why a selected
; vehicle is not fauna (all capped).
; 1 only while chasing a UI or squad-selection problem.
ui_debug=0
