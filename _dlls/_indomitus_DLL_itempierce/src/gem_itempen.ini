[ItemPierce]
; 1 = on. Rounds that pierce an armoured volume of an entity carrying the script tag below
; keep flying (and can hit what is behind / inside it, e.g. the head under a helmet).
Enabled=1
; Entity script tag ({tags add "..."} on the item), case-insensitive.
Tag=pierce_through
; 0 off, 1 log each pass-through (first 500), 2 also log every hit record on a tagged entity
Log=1
; Entity tag vector offset (std::vector<Tag> at entity+0x4E8 on 1.067). Do not change.
EntityTagsOffset=0x4E8
