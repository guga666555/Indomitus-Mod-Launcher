; GEM HostServer 0.1 - the multiplayer host server starts frozen until the launcher has loaded the
; payload into it (without this the server can read the mod's scripts before gem_scriptext is in)
; Shipped inside the Indomitus Launcher payload: edit THIS file in the repo and rebuild the
; launcher. The copy under %LocalAppData%\Indomitus Launcher\payload\ is rewritten every launch.
[HostServer]
; 0 = the dll hooks nothing; the launcher then only finds the server in the process list (late)
Enabled=1
; how long a frozen server waits for the launcher's answer before it is started anyway. 2..300
; (the launcher needs about a second: it writes and checks its copy of the payload first)
WaitSeconds=30
; gem_hostserver.log in the payload folder, rewritten every run
Log=1
