; GEM ConquestUI settings. Lives next to the DLL (the launcher payload folder when injected by the
; Indomitus Launcher). Only call_to_arms.exe has the Dynamic Campaign UI; in the editor and the
; dedicated server the DLL logs one line and does nothing. UI only: nothing here touches the simulation.
[conquestui]
; 0 = pass-through only, nothing is patched
enabled=1
; gem_conquestui.log next to the DLL (the editor / server write gem_conquestui_editor.log / _server.log)
log=1
; console window with the same messages
console=0
; log the first few previews / portrait passes (capped)
verbose=1

; ---- research tree unit preview ----
; Clicking a unit in the campaign research tree shows it in the inspector under the tree (the engine's own
; multiplayer-library unit card). Researched units become clickable for the preview only.
; Needs mod_side/DynamicCampaignResearchTree.xml (the vanilla file with its commented-out inspector re-enabled) in the mod.
; Without the launcher that layout crashes the game when research is opened: nothing starts its inspector.
research_preview=1
; id of the inspector in that layout
inspector=inspector

; ---- research tree zoom ----
; Mouse wheel over the research tree zooms in and out around the mouse pointer (drag still pans the tree).
research_zoom=1
; key that must be held to zoom: ctrl / shift / alt = the wheel scrolls the tree as in vanilla and zooms only while
; that key is held; empty = the plain wheel zooms (and no longer scrolls the tree up/down)
zoom_modifier=ctrl
; zoom limits and step per wheel notch, in percent (100% is always one of the steps)
zoom_min=40
zoom_max=150
zoom_step=20
; least time between two zoom levels, in ms (0-1000): wheel notches that come sooner are ignored, because each level
; re-lays out the whole tree; 0 = every notch counts
zoom_delay=150
; 1 = the tree reopens at the last zoom (for this game session), 0 = always at 100%
zoom_remember=1

; ---- unlocked portraits (Reinforcements / Airstrikes / Emplacements tabs) ----
portrait_filter=1
; start mode: 1 = only unlocked (researched) units, in the game's order
;             0 = every unit, unlocked ones first
portrait_mode=1
; button on the campaign page that switches between the two modes (mod_side/DynamicCampaignOverview.xml)
portrait_toggle=1
toggle_button=btn_portraits
; button text while each mode is active (what a click will do). A value with a "/" and no space is a localization
; key, looked up in the game's language (the mod ships localizations/default/interface/text/dlg_gem_conquestui.pot);
; a key with no text shows the English default. Plain text is shown as written; empty = keep the text from the layout.
toggle_label_unlocked_only=main_menu2/dynamic_campaign/gem_show_locked
toggle_label_all=main_menu2/dynamic_campaign/gem_hide_locked
