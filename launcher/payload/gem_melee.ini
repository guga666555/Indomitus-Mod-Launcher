; GEM Melee 0.1.20 settings: gem_melee.dll = GEM MeleeStance 0.7.42 (stance) + GEM MeleeChase 0.5.4 (chase) + GEM PenFilter 0.1.1
; (pen) in one dll. Lives next to gem_melee.dll (the Indomitus launcher payload folder; a hosted MP server reads its copy in
; <payload>\server\). Read by call_to_arms.exe, call_to_arms_ed.exe and call_to_arms_server.exe.
;
; Generated by tools\make_ini.py: [Core] and [Link] are new; every section after them is one of the three old inis with its own
; comments, at the values Alex runs today (payload a1d6ed3c); the 0.7.42 key AutoMeleeTag has its 0.7.42 value. Lines that start
; with "; gem_melee" are notes added for the merge.
; GetPrivateProfile rules: the first section / first key of a name wins, names are case-insensitive, no comment after a value.
; gem_meleestance.ini, gem_meleechase.ini and gem_penfilter.ini are not read any more (the log says "... ignored").
; Without this file every module runs on its code defaults: [Charge] CooldownMs 4000 instead of 2000, [AutoDraw] ProbeAnyRange 1
; instead of 0, and the 0.7.42 no-melee rule on ([MeleeStance] AutoMeleeTag melee_infantry).
;
; One log for the whole dll, next to it: gem_melee.log (game), gem_melee_editor.log (editor), gem_melee_server.log (dedicated
; server); append mode, readable while the game runs. Each line: wall time, sim clock ms, [core] / [chase] / [stance] / [pen] /
; [link], then the module's own text.
; It changes AI decisions (simulation): every player of a multiplayer match and the server need the same build.
; Do not rename gem_melee.dll: GEM Teleport 0.2.14 finds the per-quant tick by this file name.

[Core]
; 1 = write the log (gem_melee.log / gem_melee_editor.log / gem_melee_server.log next to the dll). 0 = no log file for any module
;     (each module's own Log key below picks which of its lines are written while this is 1)
Log=1
; 1 = log fatal exceptions (first chance, with a stack scan) and who ends the process (MeleeChase's crash logger, one copy for the
;     whole dll). Runs only where MeleeChase ran it: [meleechase] crash_log=1 and enabled=1, in a call_to_arms exe.
CrashLog=1
; new battle: the sim clock stepping back by at least this many ms is a restart (editor stop / play, match end, next mission).
; Stance and pen flush their per-battle tables on it as well as on their own rules; chase keeps only its own rule. 1..60000.
NewBattleBackMs=1000
; 1 = each code write suspends the other threads of the process while it writes (matters only when the dll is put into a
;     server that is already running; at game start no other thread exists). At load one walk over the thread list serves
;     every code write of the three modules (the attach batch: the loader lock keeps the set of running threads fixed while
;     the dll loads); the "[core] code writes:" line says how many, how many walks and how long. 0 = plain writes, as
;     MeleeStance / PenFilter did.
PatchSuspendThreads=1
; seconds after load during which the dll looks once a second for an old gem_meleestance / gem_meleechase / gem_penfilter dll
; loaded after it (WARNING line: remove it from the payload). 0 = off. An old dll loaded BEFORE gem_melee turns the matching
; module off at load instead ("... is already loaded in this process").
LateGuardSeconds=60

[Link]
; How the three modules work together (spec section 6). Log only, except CeasefireVeto. Nothing here changes which weapon a
; unit picks or which order it gets.
; R4 flip detector: a unit whose front order changes FlipChanges times within FlipWindowMs gets one "[link] flip:" block (its
; last order changes and the last stance / pen / chase verdicts on it) and is then muted for 10 s. A unit becomes a suspect at
; its 2nd change inside the window; only suspects' weapon picks and verdicts are noted. Inputs: stance's order poll (human units
; on its poll list; not the human player's own units outside the stance with [AutoDraw] PlayerUnits=0, nor linked, SkipTags or
; directly controlled units) and every chase approach registration (a vehicle in the hold / chase loop trips with the same
; order class each time). FlipLines = blocks per battle for all units, at most 2 per unit; when it is reached one "FlipLines=..
; reached" line says so (no block after it does not mean no flip) and the next battle starts with the count not written. 0 = off.
Flip=1
FlipChanges=5
; stance samples a unit's front order once per order poll ([AutoDraw] PollMs, 250-300 ms live), so the window must hold at least
; FlipChanges+1 polls; 6 in 2000 ms never trips on the live twitch log (8.4 --replay)
FlipWindowMs=3000
FlipLines=20
; R5 trace: 1 = a unit that carries the entity tag TraceTag gets a "[link] trace:" line for each of these: stance's weapon pick
; (every pick, PASS included; stance's charges, draws and orders are not traced, see their own lines), chase's priority change,
; approach registration and hold, pen's hook A verdict (every call, held ones too) and X. At most TraceLines per battle: a traced
; vehicle under pen fills 2000 within seconds of combat. No mod file sets ai_trace: give one unit the tag for a test (an editor
; script / breed {tags} line). For following one unit; 0 = off (one global load per decision).
Trace=0
TraceTag=ai_trace
TraceLines=2000
; R3: 1 = pen's weapon stop ([PenFilter] HookExhaust / ExhaustStop) is refused for a weapon whose item tags hold [meleechase]
; melee_tag or vehicle_melee_tag (with today's data pen never stops a melee weapon). Chase's hold is never refused. 0 = off.
CeasefireVeto=1
; R8 diagnostic: 1 = time pen's row filter (hook A) and write a "[link] cost:" line every 5 s while the numbers change: stance's
; own time, the engine's MatchAmmo time incl. pen A, pen A, engine alone (needs [MeleeStance] HookTiming=1). Costs two timer
; reads per hook A call and inflates stance's "engine MatchAmmo" share on the hb: line; pen A is printed without the timer's own
; cost (measured once at load, the line says how much), which stays in "engine alone". Set 1 only for a cost run (AT-12).
CostLine=0

; ======================================== MeleeStance 0.7.42 (stance module; its own ini, sections [MeleeStance] .. [ReloadCancel])
[MeleeStance]
; 1 = hook installed
Enabled=1
; script tag that puts a human in melee stance (the melee_toggle button adds/removes it)
Tag=melee_stance
; second tag that also means "in stance", for breed {tags} / mission triggers; the button never removes it
AlwaysTag=melee_always
; 0.7.42 (Alex, Nov 20 2026: "unless the unit has the melee_infantry tag it doesn't cycle their weapons to melee; but if they are in
; the melee stance, it accepts the ask to use melee"): a human may be switched to its melee weapon only while it is in stance (Tag /
; AlwaysTag) or carries this entity tag (breed {tags}, copied onto the unit by BreedTags). Every other human: each melee ammo
; candidate is refused whatever the target (infantry, vehicles, a vehicle it was ordered onto, IgnoreTargetTags targets), its guns are
; the engine's choice, and the dll never probes it, holds it off its guns, draws its melee weapon, gives it a fight order or charges
; it ([AutoDraw], [Charge], [Zerg]). Units under direct control and linked units as before. Log no-melee: (first 40 per mission),
; hb: line "no-melee refused". Empty = 0.7.41 (every human carrying a melee weapon may be switched to it).
; A list (up to 4, any one is enough), e.g. melee_infantry,melee_auto: a second tag lets melee-capable breeds melee without the [Zerg]
; charge, whose own Tag is melee_infantry. Nov 20 2026: only 6 MP breeds carry melee_infantry (bp/dg cultist5, bp_storm_melee, dg_melee,
; dg_vet_melee); assault marines, raptors, ork boyz / grots (choppa-only ones too), cultist6, commissars and officers do not, so with
; this value they never melee unless in stance. Tag those breeds or ship this empty.
; gem_melee 0.1.0 (Alex, Nov 21 2026): melee_infantry = may melee + the AI [Zerg] charge (the 6 TG melee breeds); melee_auto =
; may melee only, no [Zerg] (the 12 assault marine breeds: um_assault*, um_vet_assault*, bra_assault*). The code default is
; melee_infantry alone, so a gem_melee.ini without this key drops melee_auto: keep this key.
AutoMeleeTag=melee_infantry,melee_auto
; ammo {tag}s that count as melee; every other ammo is refused while the unit is in stance
MeleeAmmoTags=melee_light,melee_heavy,medium_inf_melee_target,medium_veh_melee_target,heavy_veh_melee_target
; 1 = units linked to something (vehicle crew, gunners, passengers) ignore the stance and the charge
SkipLinked=1
; 1 = ammo.set melee rows marked {ready_for_shot} also let a unit in stance draw the weapon from its belt
DrawFromBelt=1
; 0.7.11: 1 = a unit under direct control (manual control, the engine's own test) is left alone: no stance ammo filter, no charge,
; no auto-draw in CQC, no reload cancel, until the player releases it (0.7.12: also the unit the manual-control manager drives; skips logged)
SkipDirectControl=1
; 0.7.17: units carrying one of these script tags are driven by another dll and left alone like direct control (comma list, max 4;
; tp_jetpack = teleport jump, set on teleport_begin, removed on teleport_end)
; 0.7.28 (Alex): hidden / melee_disabled = script tags that make the dll ignore the unit (no stance filter, charge, auto-draw, fight order)
; valkyrie = every Valkyrie, sensor_off = every dormant call-in / spawner (40k_spawners). Comma list, max 8.
; 0.7.29: disable_melee = the tag the removed melee_inf_atk mission triggers honoured (same meaning as melee_disabled)
SkipTags=tp_jetpack,hidden,melee_disabled,disable_melee,valkyrie,sensor_off
; 0.7.28: targets carrying one of these are no enemies for the dll: weapon picks against them go straight to the engine (no stance
; filter, charge or auto-draw) and the fight-range poll does not see them. Comma list, max 8.
IgnoreTargetTags=hidden,melee_disabled,valkyrie,sensor_off
; 0.7.14 diagnostic: 1 = log (mdiag: lines) every change of the direct-control flags on the human player's units.
; 0.7.35: off. It makes one to four system calls on every weapon pick (thousands a second); only for hunting a direct-control bug.
DiagManual=0
; 0.7.34: times the weapon-pick hook (the dll's own part, the order poll inside it, the engine's part) on the hb: log line. 0 = off.
HookTiming=1
; 0.7.35: 1 = a weapon pick by a unit known to carry no melee weapon goes straight to the engine, and the known-units table is
;         not searched again for a unit noted less than 200 ms ago. 0 = every pick takes the full path (0.7.34).
FastPass=1
; 0.7.35: 1 = the dll's tick and order poll stay idle until the engine has asked THIS process for a weapon pick. On the client
;         of a hosted game it never does (the simulation runs on the server), and the poll cost 1.5 ms a tick for nothing.
;         0 = tick from the first order event (0.7.34).
ClientGate=1
; 1 = turning the stance ON (melee_toggle) puts the melee weapon in hand ({take_item} in melee_toggle.set), and a charge by a stance unit
; that is not holding its melee weapon re-draws it before the attack order
DrawOnToggle=1
DrawButton=melee_toggle
; ms: no second take-item order for the same unit while the first may still be running (a re-added order restarts the take)
DrawCooldownMs=3000
; 1 = write gem_meleestance.log (install lines + the first 40 stance and 40 charge decisions)
; gem_melee: the stance lines go to gem_melee.log with the [stance] prefix ([Core] Log=0 stops every module's lines). Log=0 no
; longer cuts the link to GEM Teleport's gem_order_listen (it ran only with Log=1 before).
Log=1

[Zerg]
; 0.7.29 (Alex): replaces the melee_inf_atk mission triggers (removed from the .mi files). 1 = an AI-owned human (never a human
; player's unit: his switch is the melee toggle) that HOLDS its melee weapon counts as in melee stance against an enemy human within
; Distance: guns refused, runs in, fight order. Not for a weapon the fight-range auto-draw put in its hand (that unit goes back to its gun).
Enabled=1
; 0.7.30 (Alex): only units carrying this tag (breed {tags} of the melee-only breeds; empty = any AI unit holding a melee weapon)
; 0.7.42: and only units that may melee ([MeleeStance] AutoMeleeTag or stance), so with AutoMeleeTag set, empty here = any AI unit
; carrying an AutoMeleeTag tag that holds a melee weapon
Tag=melee_infantry
; units, 20 = 1 m (1600 = 80 m)
Distance=1600
; ms: a charge order that something else replaced (the bot's Lua squad orders) is given again this soon
ReorderMs=700

[Charge]
; 1 = units with melee weapons charge enemies they see (same attack order as a double-click)
; 0.7.42: only units in melee stance or tagged [MeleeStance] AutoMeleeTag; a queued charge of a unit that lost both is dropped
Enabled=1
; script tag a unit needs to charge (units in melee stance always qualify)
Tag=has_melee_weapon
; 1 = only while the melee weapon is in hand (stance units always qualify)
MeleeInHand=1
; 1 = player-controlled units charge too, 0 = AI units only
PlayerUnits=1
; minimum age of the running order before a stalled unit is re-ordered (ms; 0.7.1: was the gate on every re-order at the same enemy)
; gem_melee: the code default is 4000, so keep this key (2000 = the value every payload runs).
CooldownMs=2000
; minimum time between any two charge orders, per unit (ms) - switching enemy, stall re-orders
RetargetMs=1500
; 0.7.9: a running charge at the SAME enemy may be re-aimed this soon after its last order (the run goal moved MoveRefreshUnits, or
; the unit got inside CloseDistance and takes the melee / attack order). Was behind RetargetMs 1500: units reacted late to enemies
; that moved (Alex).
RefreshMs=400
; one attack order per enemy: while the unit is still closing on the enemy it was sent at, nothing is re-issued (a new order
; restarts the running one: the unit stops and re-paths). Re-issued only when the unit stalls (0.7.1: it moved less than
; ProgressUnits itself and the distance closed by less, two one-second samples in a row, after CooldownMs; before, an enemy
; walking up counted as progress and units stood staring), the enemy is gone, or another enemy is closer than SwitchRatio x the
; current one. 0.7.1: a unit whose last order was the melee draw gets its run / melee order the moment the weapon is in hand.
SwitchRatio=0.6
ProgressUnits=10
; the charge itself: farther than CloseDistance (world units, 20 = 1 m) the unit gets the player's double-click move: a movement-mode
; order (RunMode: the engine's 0..3 modes, 2 = run; -1 = none) and then Order::eMoveTask to the enemy's spot (the double-click move;
; the single-click move is Order::eAdvance, the slow weapon-up walk, which forces mode 1), re-issued when the enemy moved MoveRefreshUnits
; from it; inside CloseDistance the attack_melee order (Order::eFight, what the attack_melee button gives); inside MinDistance nothing.
; An attack order on an enemy out of weapon reach does not make a stance unit approach.
; (0 = eFight from the start with no run phase: tried Nov 7 2026, worse than the run phase)
CloseDistance=200
MoveRefreshUnits=40
; 0.7.13: ... or this share of the current distance to the enemy, whichever is larger (0 = MoveRefreshUnits only). Every re-issued
; move restarts the run, so vs an enemy that keeps moving a 40-unit refresh every RefreshMs left units hanging 20-50 m off (Nov 8 log)
MoveRefreshFraction=0.4
; gem_melee 0.1.1 (port edit S23; Alex, Nov 21 2026: a stance marine sent in from far kept running to where the enemy had been):
; ... and never more than this many units (0 = no upper limit, the 0.7.42 rule). With the share alone a run ordered 53 m out
; was first re-aimed 5.4 s later, the enemy 15 m from the ordered spot (his log). 200 = after 10 m at any range beyond 25 m;
; inside 25 m nothing changes (0.4 x 500 = 200), so no run is re-aimed more often than the 0.7.13 rule already does there.
MoveRefreshMaxUnits=200
; gem_melee 0.1.2 (port edit S24; Alex, Nov 21 2026: "Yes, build it"): intercept lead. 1 = the far charge run at enemy infantry goes
; to where the enemy will be: its position + its velocity x the time a runner needs to meet it. The velocity comes from the
; enemy's position every 250 ms (taken whenever a unit's scan looks at it), averaged with the sample before; an enemy that stands,
; jumps or was not looked at for 1.5 s has none and the run goes to its position, as before. A stall re-order runs straight at
; the enemy and keeps that unit unled for 15 s. Vehicles are never led. 0 = off (0.1.1). How often the goal follows: Smooth below.
Lead=1
; gem_melee 0.1.2: ... never further ahead than this many seconds of the enemy's movement (also the lead when a runner at
; LeadRunSpeed cannot catch it). 0 = no lead.
LeadSeconds=3
; gem_melee 0.1.2: ... and never more than this x the time the enemy has kept its heading (a stop or a turn of more than 45 degrees
; starts it over): 0.5 = an enemy 2 s on its course is led by 1 s, one that dashes and stops by next to nothing. 0 = no such limit.
; Model tools\lead_sim.py (re-aim cost 0.2-0.6 s, runner 100-135 units/s): against enemies that keep walking or running the
; charge closes 10-50 % sooner with a quarter to a third of the re-aims; against ones that dash and stop or only shuffle it is
; as 0.1.1. With 0 the first group gains a little more and dash-and-stop is up to 5 % slower. A model, not a game test.
LeadKeep=0.5
; gem_melee 0.1.2: the charging unit's run speed for the meeting time, world units per second (20 = 1 m; marines ran 118-135 in
; the logs). 20..1000.
LeadRunSpeed=120
; gem_melee 0.1.2: the run goal is never further from the enemy than this share of the distance to it (0..1).
LeadMaxFraction=0.5
; gem_melee 0.1.3 (port edit S25; Alex, Nov 21 2026 on 0.1.2: "he only updates his pos once he gets to the original location"):
; 1 = a running charge run gets its new goal inside its own order instead of a new order. That is the engine's squad-follow way:
; the unit's front eMoveTask takes over the goal of a carrier order and re-plans its path while the unit keeps moving, so there is
; no stop and the goal can follow the aim point closely. Used when the unit's front order is a run order the dll gave and it is
; moving; otherwise, and for 10 s after an order refused it, a new order as before. The engine methods are checked once per
; session (log "in-place re-aim ON" or "OFF"). 0.1.4: it runs from a weapon-pick scan, inside the engine's quant (from the
; dll's tick the engine's path planner asserted: a hitch per re-aim in the editor). 0 = always a new order.
Smooth=1
; gem_melee 0.1.3: an in-place re-aim at the earliest this many ms after the unit's last order or re-aim (100 or more).
SmoothMs=600
; gem_melee 0.1.3: ... when the aim point (the enemy, or the lead point) is further from the run's goal than this share of the
; distance to the enemy, at least MoveRefreshUnits. A NEW order (in place not possible) keeps the limits above (40 units / 40 % /
; MoveRefreshMaxUnits) and is given when the enemy leaves the course the run was aimed with or the run's lead time is used up.
SmoothFraction=0.1
; gem_melee 0.1.8 (Alex, Nov 22 2026 on 0.1.7: "1.6 was way better, we just need to fix those dangling orders"): the engine's
; AddOrder flag 1, which every order of this dll used, APPENDS the order to the unit's queue; orders piled up there (his log:
; 33 on one unit) and ran later, one outdated goal after the other. 1 = a new charge order takes the place (flags 5, what a
; normal click passes) of the dll's own run order in front, inside the engine's quant; behind any other order (the dll's own
; fight order, an order of the player, the bot or the engine) it is appended, but only one order of the dll's waits there,
; never more. Switching the stance off cancels the unit's queue while an order of the dll's is in it, then the gun comes
; back. 0 = always appended (0.1.5).
ReplaceOwn=1
RunMode=2
; farthest enemy to charge, in world units (20 = 1 m; 2000 = 100 m; 0 = any enemy the unit's scan sees)
MaxDistance=2000
; 0.7.40: a human player's unit charges an enemy of its own choosing only inside this distance (600 = 30 m). The enemy the
; player ordered it onto has no limit. 0 = MaxDistance for everyone. 0.7.41: 1000 = 50 m (Alex).
PlayerMaxDistance=1000
; closer than this (world units) the unit is already fighting: no new order (stops order spam in melee)
MinDistance=60

[MultiSelect]
; 1 = {instant} buttons with {apply_to_all} (melee_toggle, overcharge, jetpack...) work on several selected units;
; vanilla only runs them when exactly one selected unit can use them
Enabled=1

[ShieldMelee]
; 1 = engine paired melee can start on a unit wearing a forcefield: the blow's attacker->target ray ignores
; hits on entities linked to the target (its shield, its kit) or carrying SeeThroughTag; walls/others still block
; 0 since 0.6.1 (Alex: back to 0.6 behaviour, no engine patch)
Enabled=0
SeeThroughTag=forcefield

[Downed]
; 1 = no weapon is chosen against a unit carrying Tag (bled-out / personage state), so the AI ignores downed units
; and melee units don't charge them
Enabled=1
Tag=start_personage

[BlowReach]
; engine paired melee (vanilla set\blow: fists, kick, rifle butt, knife, bayonet, sword): the attacker walks to
; within this distance of the target's centre, then the blow plays. World units; vanilla 17 / 29 / 35.
; Applies to every paired fight in the game (no per-target version). Enabled=0 = keep vanilla.
Enabled=1
Near=45
Medium=45
Far=45

[AutoDraw]
; 0.7: a human carrying a melee weapon with enemy infantry within Distance (world units, 20 = 1 m; 100 = the 5 m fight/distance
; of 40k_human.inc) is held in a temporary stance for HoldMs after the last such sighting: guns refused, melee weapon drawn
; (one take-item order for Item per DrawCooldownMs). When nobody is that close any more the hold runs out and the gun comes back.
; A unit whose melee weapon came out this way only charges enemies within 2 x Distance.
; 0.7.42: everything in this section (probe, hold, draw, order poll, fight order) only for units in melee stance or tagged
; [MeleeStance] AutoMeleeTag.
Enabled=1
Distance=100
HoldMs=3000
; 0 = AI-controlled units only: a human player's units are never probed, auto-drawn for or sent back to their gun
;     (their switch is the melee toggle). 0.7.36: default 0 (Alex), and the order-pick path and the order poll honour it too.
; 1 = every unit (0.7.35 and older)
PlayerUnits=0
; the {item} word of the take-item order (same match as the melee_toggle button: the stuff\melee folder name)
Item=melee
; 0.7.16: the engine only offers a belt melee weapon when no gun row in ammo.set wins first, so a unit holding a gun was never seen
; with melee and never drew. Probe=1: enemy inside Distance and no melee seen on the unit -> its guns are refused for one weapon
; pick (ProbeMs); melee offered = auto-draw as above, only guns = no melee weapon, guns kept for NoMeleeMs. At most one probe per
; unit per ProbeCooldownMs.
Probe=1
ProbeMs=300
ProbeCooldownMs=4000
NoMeleeMs=20000
; 0.7.18: probe on the first enemy a unit scans at ANY range (a far probe only learns the answer, the gun keeps firing after one
; refused pick); a unit found with melee is remembered for KnownMs (the engine only offers belt melee when no gun row wins)
; gem_melee: 0 = the value every payload since Guga's 0.9.15 runs; the 0.7.42 source ini said 1 and the code default is 1,
; so keep this key.
ProbeAnyRange=0
KnownMs=300000
; 0.7.18: a unit under an explicit attack order runs no enemy scan and re-picks no weapon, so every PollMs the dll checks the units
; it has seen scan: attack order on enemy infantry inside Distance -> melee in hand: fight order; known melee: draw; unknown: left alone
OrderPoll=1
PollMs=250
; 0.7.19: "does it carry melee" = the melee_toggle button's own test (after the button was clicked once this session), else the
; probe; with neither, the poll orders the draw like the toggle does and, if no melee weapon is in hand after BlindCheckMs, the
; unit keeps its gun for NoMeleeMs. Units the enemy's scans target are polled too (a unit on an order never scans itself).
BlindCheckMs=8000
; 0.7.24 fight-range stance: a unit that is idle, on an attack order or on one of this dll's orders, with a hostile human within
; Distance (its attack target, else the nearest known hostile), is put into melee: guns held off, melee weapon drawn (heavy
; weapons give way too), then the fight order. Nobody in range any more: the hold ends after HoldMs and the unit shoots again.
; A unit on a move order is left alone. Proximity=0 = only the unit's own attack-order target counts.
Proximity=1
; melee weapon still not in hand this long after the draw order: the fight order is given anyway (0 = wait for the weapon)
EscalateMs=1500
; 0.7.27: a unit the dll put into melee stays in it until the enemy is beyond Distance x LeaveFactor (in at 5 m, out at 7.5 m),
; so it does not swap weapons back and forth at the edge. 1 = no buffer.
LeaveFactor=1.5
; 0.7.22: the engine asks for a weapon very rarely while a unit is on an attack order (one hook call in a whole test session), so
; the dll ticks itself: queued draws / fight orders go out and the order poll runs without waiting for the engine.
; 0.7.23: the tick runs at the start of each engine frame on the engine's own thread (the frame function's vtable slot, found from
; the engine thread's stack on the first hook / order event; the 0.7.22 window-thread message hook was the wrong thread), at most
; once per TickMs / 2. Tick=0 = old behaviour (everything waits for an enemy scan).
; gem_melee: the same quant hook gives GEM Teleport its per-quant tick (gem_quant_listen, jetpack aim rings); Tick=0 = no jetpack
; aim events at all once Teleport has registered (it then waits for quant ticks that never come).
Tick=1
TickMs=100
; 0.7.16: inside Distance a unit with its melee weapon in hand (or in melee stance; drawn first if not) gets the attack_melee order
; (eFight) on the enemy, also when already in reach. Not re-issued while it runs on that enemy, nor within FightCooldownMs, nor
; over a player order on another enemy. 0 = old behaviour (no order in reach; the engine's own blows).
FightOrder=1
FightCooldownMs=1500
; 0.7.17: also apply the fight-range rules to weapon picks made for ORDERS (a right-click attack order), not only to the AI's own
; enemy scan; which order picks go melee is decided in the dll (order_goes_melee). Every new (unit, enemy) pick is logged (order:).
OrderPicks=1

[Vehicles]
; 0.7: units in melee stance (button or AlwaysTag) also melee vehicles. Hand-melee ammo carrying one of VehicleMeleeTags is
; allowed against a non-human actor for stance units only (every other unit is refused), and refused while the unit saw enemy
; infantry within [Charge] MaxDistance in the last InfantryMs, so infantry comes first. Needs ammo.set rows for these tags in
; the vehicle target classes. A unit whose current order is an attack on a vehicle stays on it: 0.7.1 the dll's own charge order
; counts too (before, any infantry seen pulled the weapon and the target away again, and units stood beside the tank), and other
; infantry only takes over when closer than SwitchRatio x the vehicle's distance. The close order on a vehicle is the
; double-click attack (Action::e_attack with the double-click flag, order+0xC1).
; 0.7.42: a unit neither in stance nor tagged [MeleeStance] AutoMeleeTag is refused melee on a vehicle it was ordered onto too
; (0.7.41 left that pick to the engine); a melee_infantry unit ordered onto a vehicle still gets the engine's choice.
Enabled=1
VehicleMeleeTags=melee_light,melee_heavy
; 0.7.10: 500 (was 3000): after the last enemy infantryman nearby dies the vehicle melee is allowed this soon; 3000 made squads stare at a
; cannon for ~5 s (log: 20 refusals "infantry seen 5 ms ago", then the attack 4 s after the last melee order)
InfantryMs=500
; 0.7.8: only enemy infantry within InfantryRange (units) holds a stance unit off a vehicle (was [Charge] MaxDistance = 100 m: one live
; guardsman far away kept whole squads staring at a tank). 400 = 20 m.
InfantryRange=400
; 0.7.8: the run at a vehicle hands over to the attack order at this distance from its centre (the run goal is the centre, which the
; pather can't reach: a Russ stops the unit ~240 out, so [Charge] CloseDistance 200 was never reached and the unit stood watching).
; A run that stalls short of a vehicle also goes straight to the attack order.
CloseDistance=400
; 1 = the close part of a vehicle charge is the attack order (eAttack, double-click flag); 0 = eFight (the hand fight, may refuse vehicles)
CloseAttackOrder=1
; 0.7.3 hull contact: the engine measures weapon range unit -> target point (the body volume's CENTRE), so a 3.3 m sword can never be
; "in range" of a tank from its front (log: stalled at 88 units) and the unit pushes into the hull without swinging. A unit under a
; vehicle attack order that stands still (moved less than ProgressUnits in a second) closer than AdjacentMax units to the vehicle
; centre is taken as pressed against the hull: for AdjacentMs the stance filter hands the engine a target point half a metre in
; front of the unit (0.7.5; it is touching the plate, so that point is on it), the weapon fires and the swing lands.
; 0.7.6: once armed the unit stays armed for as long as its attack order on that vehicle runs and it is within 2 x AdjacentMax of the
; centre (0.7.5 re-armed only from a fresh stall, so every shove by the engine's approach dropped the range again and the units ran
; around the tank). AdjacentMax 120 = a Leman Russ from any side (log: 48-96), a Baneblade's side; a unit queued behind a friend at
; 155 does not arm (it would swing at air). 0 = off. Crews of guns / vehicles never count as "infantry seen" and are never charged
; (they can't be fought while linked).
AdjacentMs=1500
AdjacentMax=120
; 0.7.4: script tag that means "touching a vehicle": 40k_human.inc {on contact} adds it (1.5 s) when a unit with its melee weapon out
; touches a vehicle's "ram" volume; the hull-contact range shift then starts at once (the stall sample above stays as the fallback)
ContactTag=hull_contact

[ReloadCancel]
; 0.7.1: a melee draw (melee_toggle, auto-draw, charge) given while the unit is reloading cancels the reload (the engine's take-item
; order otherwise waits for the reload to end: "stuck holding the weapon"). Technically every running inventory op of the unit is
; dropped (Human::CancelInventoryOps, the same call the engine uses), which on the host also tells the clients.
Enabled=1
; item tags ({tag} of the stuff set / pattern) of weapons whose reload is NOT cancelled: the heavy weapons keep reloading and the
; draw waits as before. mgun = every machine-gun-pattern weapon (heavy stubbers, autocannons, assault cannon, meltaguns too);
; stubber / hmg_shell = IG stubbers; lascannon, plasmacannon + sm_weapon_plasmacannon, sm_weapon_heavybolter, rocketlauncher
; (rpg_weapon pattern), heavy_flamethrower, grenadelauncher, at_rifle, ogryn_weapon (ripper guns, ogryn stubbers).
; Plain flamers (flame_thrower), plasma guns, lasguns, bolters, pistols, shotguns swap at once.
KeepTags=mgun,hmg_shell,stubber,lascannon,plasmacannon,sm_weapon_plasmacannon,sm_weapon_heavybolter,rocketlauncher,heavy_flamethrower,grenadelauncher,at_rifle,ogryn_weapon

; ======================================== MeleeChase 0.5.4 (chase module; its own ini, section [meleechase]) ======================
; GEM MeleeChase settings. Lives next to gem_meleechase.dll (the Indomitus launcher payload folder).
; Read by call_to_arms.exe, call_to_arms_ed.exe and call_to_arms_server.exe only.
; Every feature checks the engine code at startup; anything it does not recognise stays off and
; gem_meleechase.log says so. It changes AI decisions (simulation): every player of a
; multiplayer match needs this DLL.
; 0.5.0: vehicle-brain units (fauna, vehicles) only. Humans are not touched: the fight-distance multiplier
; (human_fight_distance / fight_distance_mult) is removed, infantry melee is GEM MeleeStance.
; gem_melee: the lines above are MeleeChase's own header. These keys are read from gem_melee.ini now, and what it says about
; gem_meleechase.log goes to gem_melee.log ([chase] prefix).
[meleechase]

; ==== general ====
; 0 = nothing is patched
enabled=1
; gem_meleechase.log next to the DLL
; gem_melee: the chase lines go to gem_melee.log with the [chase] prefix (no separate gem_meleechase.log, no truncation at start).
log=1
; console window with the same messages
; gem_melee: no longer read (no console window; the one log has every line).
console=0
verbose=1
; log fatal exceptions (with a stack scan) and who ends the process
; gem_melee: the crash logger belongs to the whole dll now; it runs when this key, enabled above and [Core] CrashLog are all 1, in a
; call_to_arms exe (MeleeChase's own conditions: enabled=0 also removes it, as in 0.5.4).
crash_log=1
; log the first chase decisions (vehicle re-paths / stops)
log_chase=1

; ==== melee weapons ====
; a weapon is "melee" when its item carries this tag ({tag "... melee ..."} in its set/stuff file)
melee_tag=melee
; 0.5.1: a second word that also marks a weapon as melee, for VEHICLE weapons ("pattern gun" sets). Never put the
; word "melee" on a vehicle gun: the engine then applies the human Melee skill to it and the server crashes when the
; vehicle spawns. Empty = off.
vehicle_melee_tag=veh_melee

; ==== vehicles / fauna ====
; a vehicle-class unit with at least one melee weapon keeps re-planning its approach while the target moves
vehicle_chase=1
; re-plan when the point the unit drives to is off by more than repath_fraction x the distance to the target,
; clamped to repath_min_m..repath_max_m (far away a few metres don't matter, up close they do)
repath_fraction=0.25
repath_min_m=1
repath_max_m=10
; how often a running approach is checked (milliseconds of game time); closer than close_range_m: the faster interval
repath_interval_ms=500
repath_interval_close_ms=200
close_range_m=10

; ==== close combat (melee units) ====
; drive to this fraction of the melee reach instead of stopping at its edge (vanilla: 0.95)
contact_factor=0.5
; aim at where the target will be: its velocity x lead_seconds, at most lead_max_m
lead_seconds=0.6
lead_max_m=6
; keep pursuing a target that backs off faster than retreat_speed_mps, even while it is still inside weapon range
; (vanilla stands still until it is out of range, then starts a new approach)
pursue_retreating=1
retreat_speed_mps=0.3
; melee units (melee weapons only, or ai_prioritize_melee) chase whenever the target is outside 90% of their reach,
; instead of standing still until it leaves weapon range
chase_always=1
; movement mode the chase sets on the unit (the vanilla vehicle AI keeps whatever mode it has, often a walk).
; Values as in the player's move orders: 0 walk, 1 normal, 2 run, 3 fastest. -1 = don't change
chase_run_mode=2
; a unit with a melee weapon: its other (ranged) weapons hold fire while the target is inside melee reach x
; hold_ranged_reach_factor, so only the melee weapon attacks. Units with ranged priority (see below) are not affected.
hold_ranged_in_melee=1
hold_ranged_reach_factor=1.0
; 1 = a path ended for a re-plan does not brake the unit first (smoother); 0 = vanilla stop, then the new path
smooth_repath=1

; ==== weapon priority (vehicles / fauna with both melee and ranged weapons) ====
; put one of these props in the unit's def: {props "... ai_prioritize_melee"}
;   ai_prioritize_melee  : the AI drives in to its melee weapon's reach (charges; ranged weapons fire on the way)
;   ai_prioritize_ranged : the AI only closes to its ranged weapons' reach and holds there (melee only if the enemy comes close)
; without either prop the vanilla choice stays. Both on one unit: melee wins.
; 0.5.4: the same two words as ENTITY TAGS switch the priority at runtime from script, e.g. a dreadnought that loses its
; gun arm: {tags add "ai_prioritize_melee"}, on repair {tags remove "ai_prioritize_melee"}. A tag overrides the def props.
; Precedence, highest first: tag ai_prioritize_melee, tag ai_prioritize_ranged, prop ai_prioritize_melee, prop ai_prioritize_ranged.
; The tag list is found in the engine code at startup; if it is not, the log says
; "weapon priority entity tags OFF" and only the props count.
weapon_priority=1
; the prop names, also the tag names
prop_prioritize_melee=ai_prioritize_melee
prop_prioritize_ranged=ai_prioritize_ranged

; 0.5.4: ranged priority (tag or prop) no longer sets the approach range: the engine's own value is kept, and it only counts
; weapons that can attack the current target, so a unit whose main gun is broken or useless against the target closes to
; what can still hit (flamer, fist). Ranged priority still skips the melee chase and the hold-ranged-in-melee rule.

; ======================================== PenFilter 0.1.1 (pen module; its own ini, section [PenFilter]) ==========================
[PenFilter]
; GEM PenFilter 0.1.1: the AI does not fire `pierce` ammo at vehicle armour it cannot penetrate,
; and aims at the highest-priority part it can penetrate.
; 1 = on.
Enabled=1
; 0 off, 1 install lines, a stats line every 10 s while something changes, and verdict lines
; gem_melee: the pen lines go to gem_melee.log with the [pen] prefix; the 10 s stats line comes from the dll's background thread.
Log=1
; budget of verdict lines; a line is only written when the verdict of (hook, shooter, target, ammo) changes
; (repeats are counted and shown in the next changed line)
LogVerdicts=400
; only ammo whose stuff {tag} list holds this tag is filtered (the engine's own penetration gate uses the same tag)
PierceTag=pierce
; ammo carrying any of these tags is never filtered (hand melee, vehicle melee shells)
ExemptTags=melee_light,melee_heavy,melee
; A: per shooter / target / ammo: ALLOW if any volume of the target can be pierced from here, else REJECT (every row of
;    that ammo skipped); rows with {volume "x"} only keep the volumes that pass
HookRowFilter=1
; B: the volume picker checks the real aimed hit with the engine's armour chain and rerolls a volume it cannot pierce
HookAimCheck=1
; P: the picker only offers the reachable pierceable volumes of the highest-priority non-empty AimPriority group
HookAimPriority=1
; X: a pick that ran out with B blocks: the ammo verdict is worked out again without the blocked volumes (REJECT if none
;    is left) and held; needs P
HookExhaust=1
; 1 = X also stops a weapon aimed at that target when that aim cannot pierce (verdict REJECT, or the volume it aims at is
;     blocked / fails the face test); the engine's own cease-fire call. A weapon aimed at a pierceable volume keeps firing.
; gem_melee: [Link] CeasefireVeto=1 refuses this stop for a weapon that MeleeChase counts as melee ([meleechase] melee_tag /
; vehicle_melee_tag on the weapon item).
ExhaustStop=1
; C: not built (ignored)
HookApproach=0
; aim priority, matched against the volume TAGS: groups separated by ';' (first = most wanted), alternatives by ','.
; Volumes in no group come last. Tags in use (Nov 2026): body / cabin / bodyback (make_component body parts),
; turret, mantlet, aux_turret1-9 (sponsons), arm_left / arm_right / gun_left / gun_right / hkm_left / hkm_right (dreadnought),
; leg_left / leg_right (dreadnought), frontleftleg ... backrightleg (walker legs), mover / track (tracks define),
; trackleft / trackright (Taurox), wheel. Barrels (main_weapon) are no_target and never offered.
; gem_melee 0.1.9 (Alex, Nov 22 2026: "add in gun volumes before tracks"): a tag written +tag names a part the engine never
; offers to the AI because it carries no_target (gun, barrel and breech volumes: tags gun, gun1 .. gun7). The dll offers
; those itself, on rows without {volume "x"} only, when the ammo can pierce them and no group before theirs has a
; reachable pierceable part. One the aim solver cannot reach is blocked like an armour miss (CacheMs / 25 degrees /
; HoldDistanceM), so the ammo falls through to the next row. Without the + a no_target part is never aimed at.
AimPriority=body,cabin,bodyback;turret,mantlet;aux_turret1,aux_turret2,aux_turret3,aux_turret4,aux_turret5,aux_turret6,aux_turret7,aux_turret8,aux_turret9;arm_left,arm_right,gun_left,gun_right,hkm_left,hkm_right;leg_left,leg_right,frontleftleg,frontrightleg,midleftleg,midrightleg,backleftleg,backrightleg;+gun,+gun1,+gun2,+gun3,+gun4,+gun5,+gun6,+gun7;mover,track,trackleft,trackright,wheel
; sim time (ms) an A verdict (ALLOW / REJECT) is kept for a shooter / target / ammo + weapon
VerdictHoldMs=8000
; m: a held REJECT or a blocked volume is dropped early when the shooter comes this much nearer, a held ALLOW when it
; moves this much farther away (0 = never)
HoldDistanceM=15
; safety limit (sim ms) for a volume B blocked (the volume hit first and the volume aimed at); it normally stays blocked
; until the direction to the shooter in that volume's frame turns by more than 25 degrees or the shooter comes nearer
CacheMs=60000
; sim ms P skips a pierceable volume the solver could not reach (no solution, elevation limit, line of fire blocked), so the
; next pick moves on to the next volume / group
UnreachableMs=3000
; 1 = engine pierce (bs flag 1): the round gets through the armour and {on pierce} fires; it may stop inside
; 3 = flags 1+2: also enough energy left to carry on past the armour (over-penetration; the sight overlay's pierced mark)
PierceRule=1
; 1 = also filter units owned by a human player (their own automatic ammo choice and aim); 0 = AI-owned units only
PlayerUnits=1
; 1 = a unit under direct control is left alone by every hook (vanilla ammo choice, aim and fire for all its weapons)
SkipDirectControl=1
; 1 = only volume faces turned towards the shooter count (box volumes: each at its own angle; .vol polyhedra: head-on,
;     only sides clearly turned away drop out); 0 = every face head-on
Facing=1
; gem_melee 0.1.12 (Alex, Nov 22 2026: dreadnoughts stood in front of a Baneblade and did not swing): the melee weapon of
; a vehicle-brain unit (walker, fauna) is a gun on a fixed foresight; against a vehicle the engine's aim solver can refuse
; every near part (elevation limit, no ballistic solution), and without an aim nothing fires. 1 = such a pick keeps its
; aim when the solver refuses it (the part is inside the picker's range check; a swing needs no firing solution).
; 0 = the solver's answer stands. The [pen] M log line counts both.
MeleeForceAim=1
