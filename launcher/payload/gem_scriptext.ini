; GEM ScriptExt settings. Lives next to the DLL (binaries\x64 when used as dbghelp.dll, or the
; launcher payload folder when injected by the Indomitus Launcher).
; Read by call_to_arms.exe, call_to_arms_ed.exe and call_to_arms_server.exe only.
; Every feature checks the engine code at startup; anything it does not recognise stays off and the
; log says so. "Simulation" features change game state: every player of a multiplayer match needs this DLL.
[scriptext]

; ==== general ====
; 0 = nothing is patched
enabled=1
; gem_scriptext.log next to the DLL
log=1
; console window with the same messages
console=0
; log fired events (first 200), the first evaluation of each condition, first {multiplier} uses
verbose=1
; log fatal exceptions (with a stack scan), C++ exceptions (one line per call chain) and who ends the process
crash_log=1
; Empty = events always fire. Otherwise the named events fire only while the engine's mod list shows an
; enabled mod whose name contains this text (case-insensitive); checked every 2 s, same check as BreedTags.
; The other features need no gate: their script words only appear in the mod's own files.
require_mod=

; ==== script conditions ====
; {if have_enemy} / {if "have_enemy"}: true while the unit's sensor currently sees at least one enemy.
; The quoted spelling loads silently without the DLL; the unquoted one logs "unknown condition" without it.
have_enemy=1
; {if health 0.6}: true while health is at or below that fraction of max health (soldiers and fauna)
health_condition=1

; ==== script actions (simulation) ====
; {health_damage_count value max_health [cap]}: damage = value x max health (negative heals; a 3rd argument
; of 1 stops a heal at 100%). {health_damage_count value set_health}: health = value x max (0 kills).
health_damage_ext=1
; optional {multiplier X} block in {health_damage_pierce ...} / {health_damage_blast ...}: the unit takes
; X times the damage (default 1.0). explosive_treshold and the throw-off table are not changed.
damage_multiplier=1

; ==== named events ====
; master switch for the hook that fires the events below
events=1
; {on "move_order"}: every unit that receives a player move order
move_order_event=1
move_order_name=move_order
; {on "selection_of_units"}: every owned unit the player selects
selection_event=1
selection_name=selection_of_units
; {on "talk_<name>"} for every other hard-coded talk moment: talk_attack, talk_kill_enemy,
; talk_board_to_vehicle, talk_burning, talk_leave, talk_cover, talk_cannot_move, ...
talk_events=1
; 1 = the events also fire in network games (every player must run the same DLL build).
; "selection_of_units" happens only on the PC of the player who selects, so in a network game its handlers
; should not change game state (tags, health, spawns...) or the match can desync; use it for local effects.
; 0 = no event fires while a network game runs.
events_in_multiplayer=1
