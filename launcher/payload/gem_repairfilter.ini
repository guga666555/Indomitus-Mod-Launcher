[RepairFilter]
; 1 = vehicles tagged (or def prop) <VehiclePrefix><class> can only be repaired by units tagged <UnitPrefix><class>
Enabled=1
; vehicle side: runtime tag or def prop, e.g. repair_by_mechanicus
VehiclePrefix=repair_by_
; unit side: runtime tag (breed {tags} through GEM BreedTags, or script {tags add}). Empty = the class itself:
; repair_by_mechanicus -> unit tag "mechanicus"
UnitPrefix=
; 1 = also refuse the player's repair command for a refused unit (it keeps its current order); 0 = only the order fails
Command=1
; script event fired on the vehicle when a player's repair command is refused (empty = none); the "vehicle" block in
; 40k_vehicle_main.inc shows the popup
PopupEvent=repair_refused
; at most one popup per unit + vehicle pair in this time (ms)
PopupCooldownMs=3000
; 1 = also patch call_to_arms_server.exe (the repair order runs in the simulation: every MP machine needs the same rule)
Server=1
; 1 = log the first 300 refusals to gem_repairfilter.log (editor: gem_repairfilter_editor.log)
Log=0
