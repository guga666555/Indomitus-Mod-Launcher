; GEM BreedTags 0.7 settings. Lives next to the DLL (launcher payload folder, or binaries\x64 next to dbghelp.dll).
; Loaded by call_to_arms.exe, call_to_arms_ed.exe and call_to_arms_server.exe (anything else only
; gets the dbghelp pass-through).
[breedtags]
; 0 = pass-through only, no hook (quick way to rule it out)
Enabled=1

; gem_breedtags.log next to the exe
LogFile=1
; Console window with the same messages (closes with the game)
Console=0
; Log every breed application (where it came from, thread, tags removed/added, event) - first VerboseMax of them
Verbose=1
VerboseMax=200

; ---- re-breeds / event ----
; 1 = when a unit gets a DIFFERENT breed (e.g. the conquest/army preview re-breeds the same soldier while you click
; through a squad), the previous breed's tags are removed before the new breed's are added. 0 = only add (0.5).
RemoveOldBreedTags=1
; Named event fired on the unit after every breed application, once the tags are in place: {on "breed_applied"}
; in interaction_entity (quoted = the engine's custom event, loads silently without the DLL). Fires for units already
; in the scene - in practice also at a normal spawn, so {on spawn} handlers may run alongside it.
; Empty = no event.
BreedEvent=breed_applied
