; GEM WeaponScript settings - one file for the three weapon modules. Sealed into the Indomitus Launcher with the
; DLL: build.bat payload copies this file into launcher\payload\; the launcher extracts it next to the DLL at
; %LocalAppData%\Indomitus Launcher\payload\<code>\. Change a value, run build.bat payload, then build_zig.bat.
[weaponscript]
; 0 = load nothing at all
Enabled=1
; gem_weaponscript.log next to the dll (every module logs into it under its own name); Console opens a log window
LogFile=1
Console=0

; ---- barrel convergence + multi-shot (gem_converge module) ----
[converge]
; 0 = this module does nothing
Enabled=1
; stuff tag on the gun's set file that turns convergence on for that weapon (case-insensitive)
Tag=converge
; no correction when the aim point is closer than this (world units, 20 = 1 m)
MinDistance=3
; the sight must be within this many degrees of the aim point for a correction (otherwise the turret is still
; turning toward the cursor and the shot goes where the barrels point, as in vanilla)
MaxAngle=10
; 1 = also act in network games. Unsynced weapons are simulated on every machine, so every player needs the dll
; (the correction is deterministic, so lockstep copies agree); 0 = do nothing in network games
AllowMultiplayer=1
; bullets_per_shot_<N> weapons: cone half-angle in degrees unless the weapon carries bullet_spread_<deg>; max N accepted
BulletSpread=3
BulletsPerShotMax=32
; Verbose logs the first LogShots affected shots
Verbose=1
LogShots=10

; ---- ammo swap by unit tag / plasma overcharge (gem_overcharge module) ----
[overcharge]
; 0 = this module does nothing
Enabled=1
; while the firing unit (or the vehicle its gunner sits in) carries this script tag, its weapon fires the ammo whose
; set-file name tags are the loaded ammo's plus OverchargeSuffix (plasmagun_mag.ammo -> plasmagun_mag.overcharge.ammo).
; An overcharge shot costs one magazine round, like a standard shot.
OverchargeTag=overcharge
OverchargeSuffix=overcharge
; Verbose logs the first OverchargeLog overcharge shots
Verbose=1
OverchargeLog=10

; ---- fire-and-forget lock-on + drift (gem_guidance module) ----
[guidance]
; 0 = this module does nothing
Enabled=1
; weapon stuff tag that turns lock-on on (its ammo must also carry the vanilla "atgm" tag)
LockTag=lock_on
; fallback turn rate in deg/s, used only when the engine's own guidance cannot run (owner dead / weapon dropped)
LockTurn=10
; drift_<N> weapons: N = degrees the round is off at 100 units (grows with distance); max N accepted
DriftMax=45
; 1 = lock-on also in network games (every player needs the dll); 0 = vanilla guidance in network games.
; Drift always applies.
AllowMultiplayer=1
; Verbose logs the first LockLog locks (lock / lock tick / lock end lines)
Verbose=1
LockLog=10
