desc=Steam चालू होना चाहिए। चुनें कि क्या शुरू करना है: Indomitus इंजन एक्सटेंशन उस प्रोसेस की पहली लाइन चलने से पहले ही उसमें लोड हो जाता है। गेम फ़ोल्डर में कुछ भी नहीं लिखा जाता - Steam से शुरू करने पर गेम बिना बदलाव के चलता है। लॉबी में सभी खिलाड़ियों को लॉन्चर का एक ही बिल्ड चलाना होगा (कोड दाईं ओर दिखाया गया है)।
